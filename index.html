<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kyaw Hmue San | Software Engineering Portfolio</title>

      name="description"
      content="Kyaw Hmue San is a software engineering student building full-stack web and mobile products with React, TypeScript, Java, Spring Boot, and PostgreSQL."
    />
    <meta name="author" content="Kyaw Hmue San" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#07090f" />
    <script>
      (() => {
        const stored = localStorage.getItem("portfolio-theme");
        const theme = stored === "light" || stored === "dark"
          ? stored
          : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="canonical" href="https://kyawhmuesan.dev/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
